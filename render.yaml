# Render blueprint for the Figma-to-Tableau billing backend (repo /backend).
#
# Deploy: Render Dashboard > New > Blueprint > pick this repo. Render reads this
# file, creates the web service, and prompts for the secret env vars below.
#
# NOTE (free tier): the instance has NO persistent disk, so backend/licenses.json
# is wiped on every restart/redeploy — license records (who paid) reset. Fine for
# testing; before real customers move to a mounted disk (Starter plan) or a DB.
# Free instances also sleep after ~15 min idle and cold-start on the next request.
services:
  - type: web
    name: figma-tableau-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Razorpay keys are dashboard-managed (sync: false): LIVE credentials
      # must never live in git. Set/rotate them in Render > Environment;
      # blueprint syncs won't overwrite them. Saving there auto-redeploys.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Optional — add in the dashboard if you use them. A subscription plan id
      # switches checkout to monthly billing; without one it's one-time orders.
      # RAZORPAY_PLAN_ID, RAZORPAY_WEBHOOK_SECRET
      # Dual-currency one-time-order pricing. Indian visitors pay INR (unlocks
      # UPI/netbanking), everyone else USD (cards). Amounts are in the
      # currency's smallest unit (cents for USD, paise for INR).
      - key: ORDER_CURRENCY
        value: USD
      - key: USD_MONTHLY_CENTS
        value: "1000"
      - key: USD_ANNUAL_CENTS
        value: "10000"
      - key: INR_MONTHLY_PAISE
        value: "85000"
      - key: INR_ANNUAL_PAISE
        value: "850000"
      - key: PREMIUM_DAYS
        value: "31"
      - key: ANNUAL_DAYS
        value: "365"
