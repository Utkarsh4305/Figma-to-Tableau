# Render blueprint for the Figma-to-Tableau billing backend (repo /backend).
#
# Deploy: Render Dashboard > New > Blueprint > pick this repo. Render reads this
# file, creates the web service, and prompts for the secret env vars below.
#
# NOTE (free tier): the instance has NO persistent disk, so backend/licenses.json
# is wiped on every restart/redeploy — license records (who paid) reset. Fine for
# testing; before real customers move to a mounted disk (Starter plan) or a DB.
# Free instances also sleep after ~15 min idle and cold-start on the next request.
services:
  - type: web
    name: figma-tableau-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Razorpay TEST-MODE keys (baked in so the deployed backend can create
      # orders). Test keys only ever move test money, but they still live in
      # git history once pushed — NEVER put LIVE keys here; set those in the
      # Render dashboard (Environment tab) instead, which overrides + redeploys.
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TBisZXcohsbIVD
      - key: RAZORPAY_KEY_SECRET
        value: oBZzQDdWLvbFuB189DDQkKPn
      # Optional — add in the dashboard if you use them. A subscription plan id
      # switches checkout to monthly billing; without one it's one-time orders.
      # RAZORPAY_PLAN_ID, RAZORPAY_WEBHOOK_SECRET
      # One-time-order pricing (paise). 85000 = ₹850. Change per your pricing.
      - key: ORDER_AMOUNT_PAISE
        value: "85000"
      - key: ORDER_CURRENCY
        value: INR
      - key: PREMIUM_DAYS
        value: "31"
      # Annual one-time order (paise). 850000 = ₹8,500 ≈ $100.
      - key: ANNUAL_AMOUNT_PAISE
        value: "850000"
      - key: ANNUAL_DAYS
        value: "365"
